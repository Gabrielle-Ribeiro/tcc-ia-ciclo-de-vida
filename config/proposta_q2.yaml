# PROPOSTA de versão 2 das strings (não aprovada; gerada no piloto de 17/11/2026).
# Só vale depois de aprovada pelas pessoas da equipe e registrada (novo hash).
#
# Mudanças em relação à v1, com a evidência em data/refinamento/ablacao_q1.json:
#   1. sai o bloco de software; o contexto vem do filtro de área de cada base
#      (arXiv: cs.SE; Scopus: SUBJAREA(COMP); OpenAlex: campo Computer Science).
#      No arXiv, o bloco derrubava estudos sem a palavra "software", como
#      "From Assistance to Agency... CI/CD Pipelines";
#   2. entram em CON "coding agent*", "AI coding", "coding tool*", "context file*"
#      e "AGENTS.md", e em TES "differential test*": todos aparecem literalmente
#      em estudos do conjunto de validação que a v1 não recuperava.
# Sensibilidade no conjunto de validação: v1 = 0,47 (8/17); v2 = 0,82 (14/17).
#
# Estrutura de cada família:  (IA) AND (ETAPA), com o filtro de área da base.

